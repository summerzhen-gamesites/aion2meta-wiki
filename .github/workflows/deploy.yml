name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        env:
          AION2_OUTPUT_DIR: public
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
        run: python build_site.py

      - name: Verify static assets
        run: |
          test -f public/index.html
          test -f public/404.html
          test -f public/sitemap.xml
          test -f public/robots.txt
          grep -q "AION 2 Meta" public/index.html
          grep -q "Beginner Complexity" public/index.html
          grep -q "Sources" public/index.html
          grep -q "google-site-verification" public/index.html
          grep -q "googletagmanager.com/gtag/js" public/index.html

      - name: Verify technical SEO and internal links
        run: python check_technical_seo.py

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.131.1
          command: deploy
